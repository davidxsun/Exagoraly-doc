<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exagroaly - Time Management App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container { max-width: 600px; padding: 40px 20px; }
        h1 { font-size: 3.5em; margin-bottom: 15px; }
        p { font-size: 1.3em; opacity: 0.9; margin-bottom: 40px; }
        .links { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn {
            background: white;
            color: #667eea;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .footer { margin-top: 50px; opacity: 0.7; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱ Exagroaly</h1>
        <p>Your personal time management & decision tracking companion.</p>
        <div class="links">
            <a href="privacy.html" class="btn">🔒 Privacy Policy</a>
            <a href="support.html" class="btn">🤝 Support</a>
        </div>
        <div class="footer">
            <p>Contact: <a href="mailto:themingledspirit@gmail.com" style="color:white;">themingledspirit@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
